<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F6FF"/>
      <stop offset="100%" stop-color="#E8F2FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A6FD4"/>
      <stop offset="100%" stop-color="#0F52A8"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26A8E0"/>
      <stop offset="100%" stop-color="#1A6FD4"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A6FD4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#F0F6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#bgGlow)"/>

  <!-- Nav -->
  <rect width="1200" height="64" fill="rgba(255,255,255,0.96)"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#D8E8F8" stroke-width="1"/>

  <!-- Logo: medical cross -->
  <rect x="36" y="18" width="28" height="28" rx="6" fill="url(#cardGrad)"/>
  <rect x="47" y="23" width="6" height="18" rx="2" fill="white"/>
  <rect x="41" y="29" width="18" height="6" rx="2" fill="white"/>
  <text x="76" y="36" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F2B5A" letter-spacing="0.5">Quick</text>
  <text x="124" y="36" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A6FD4">Med</text>

  <!-- Nav links -->
  <text x="490" y="37" font-family="Arial, sans-serif" font-size="12" fill="#6B8CB4" letter-spacing="1">Shop</text>
  <text x="560" y="37" font-family="Arial, sans-serif" font-size="12" fill="#6B8CB4" letter-spacing="1">Prescriptions</text>
  <text x="690" y="37" font-family="Arial, sans-serif" font-size="12" fill="#6B8CB4" letter-spacing="1">Health Blog</text>
  <text x="808" y="37" font-family="Arial, sans-serif" font-size="12" fill="#6B8CB4" letter-spacing="1">Find Store</text>

  <!-- Search + icons -->
  <rect x="990" y="17" width="80" height="30" rx="15" fill="#F0F6FF" stroke="#D8E8F8" stroke-width="1"/>
  <text x="1010" y="37" font-family="Arial, sans-serif" font-size="13" fill="#6B8CB4">⌕ Search</text>
  <circle cx="1120" cy="32" r="14" fill="url(#cardGrad)"/>
  <text x="1120" y="37" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">⊕</text>

  <!-- Left hero -->
  <!-- Badge -->
  <rect x="80" y="98" width="228" height="26" rx="13" fill="rgba(26,111,212,0.08)" stroke="#1A6FD4" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="97" cy="111" r="4" fill="#1A6FD4"/>
  <text x="110" y="116" font-family="Arial, sans-serif" font-size="10.5" fill="#1A6FD4" letter-spacing="1.5">TRUSTED BY 5,000+ USERS</text>

  <!-- Headline -->
  <text x="80" y="188" font-family="Georgia, serif" font-size="50" font-weight="bold" fill="#0F2B5A">Your Pharmacy,</text>
  <text x="80" y="248" font-family="Georgia, serif" font-size="50" font-weight="bold" fill="#1A6FD4">On-Demand.</text>

  <!-- Subtext -->
  <text x="80" y="296" font-family="Arial, sans-serif" font-size="15" fill="#4A6A94">Upload prescriptions, track orders, set reminders.</text>
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="15" fill="#7A9ABC">Delivered to your door in under 2 hours.</text>

  <!-- Buttons -->
  <rect x="80" y="355" width="180" height="48" rx="8" fill="url(#cardGrad)"/>
  <text x="170" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Download App</text>
  <rect x="278" y="355" width="148" height="48" rx="8" fill="none" stroke="#1A6FD4" stroke-width="1.5"/>
  <text x="352" y="385" font-family="Arial, sans-serif" font-size="13" fill="#1A6FD4" text-anchor="middle">Upload Rx</text>

  <!-- Stats -->
  <text x="80" y="452" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F2B5A">5,200+</text>
  <text x="80" y="472" font-family="Arial, sans-serif" font-size="10" fill="#6B8CB4" letter-spacing="1">MONTHLY USERS</text>
  <text x="220" y="452" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F2B5A">2hrs</text>
  <text x="220" y="472" font-family="Arial, sans-serif" font-size="10" fill="#6B8CB4" letter-spacing="1">AVG. DELIVERY</text>
  <text x="340" y="452" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F2B5A">24/7</text>
  <text x="340" y="472" font-family="Arial, sans-serif" font-size="10" fill="#6B8CB4" letter-spacing="1">SUPPORT</text>

  <!-- Right — phone mockup -->
  <rect x="760" y="75" width="210" height="390" rx="28" fill="white" stroke="#D8E8F8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="772" y="87" width="186" height="366" rx="20" fill="#F5F9FF"/>

  <!-- Notch -->
  <rect x="825" y="83" width="60" height="14" rx="7" fill="white"/>

  <!-- App top bar -->
  <rect x="772" y="87" width="186" height="56" rx="20" fill="url(#cardGrad)"/>
  <rect x="772" y="118" width="186" height="25" fill="url(#cardGrad)"/>
  <text x="865" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">QuickMed</text>
  <text x="865" y="130" font-family="Arial, sans-serif" font-size="9.5" fill="rgba(255,255,255,0.75)" text-anchor="middle">Good morning, Arjun ☀️</text>

  <!-- Search bar inside app -->
  <rect x="784" y="150" width="162" height="28" rx="14" fill="white"/>
  <text x="808" y="169" font-family="Arial, sans-serif" font-size="11" fill="#9BBAD8">⌕  Search medicines...</text>

  <!-- Category pills -->
  <rect x="782" y="192" width="54" height="20" rx="10" fill="rgba(26,111,212,0.12)" stroke="#1A6FD4" stroke-width="0.8"/>
  <text x="809" y="206" font-family="Arial, sans-serif" font-size="9" fill="#1A6FD4" text-anchor="middle">All</text>
  <rect x="844" y="192" width="62" height="20" rx="10" fill="white" stroke="#D8E8F8" stroke-width="0.8"/>
  <text x="875" y="206" font-family="Arial, sans-serif" font-size="9" fill="#6B8CB4" text-anchor="middle">Vitamins</text>
  <rect x="914" y="192" width="56" height="20" rx="10" fill="white" stroke="#D8E8F8" stroke-width="0.8"/>
  <text x="942" y="206" font-family="Arial, sans-serif" font-size="9" fill="#6B8CB4" text-anchor="middle">Skincare</text>

  <!-- Medicine cards 2x2 -->
  <rect x="782" y="222" width="78" height="84" rx="12" fill="white" stroke="#D8E8F8" stroke-width="1"/>
  <rect x="790" y="232" width="26" height="26" rx="6" fill="rgba(26,111,212,0.12)"/>
  <rect x="798" y="237" width="10" height="16" rx="2" fill="#1A6FD4" fill-opacity="0.5"/>
  <rect x="794" y="243" width="18" height="5" rx="1.5" fill="#1A6FD4" fill-opacity="0.5"/>
  <text x="790" y="274" font-family="Arial, sans-serif" font-size="9" fill="#0F2B5A" font-weight="bold">Paracetamol</text>
  <text x="790" y="286" font-family="Arial, sans-serif" font-size="8.5" fill="#6B8CB4">500mg · Strip</text>
  <text x="790" y="300" font-family="Arial, sans-serif" font-size="9" fill="#1A6FD4" font-weight="bold">₹24</text>

  <rect x="868" y="222" width="78" height="84" rx="12" fill="white" stroke="#D8E8F8" stroke-width="1"/>
  <rect x="876" y="232" width="26" height="26" rx="6" fill="rgba(38,168,224,0.12)"/>
  <circle cx="889" cy="245" r="8" fill="none" stroke="#26A8E0" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="889" cy="245" r="4" fill="#26A8E0" fill-opacity="0.5"/>
  <text x="876" y="274" font-family="Arial, sans-serif" font-size="9" fill="#0F2B5A" font-weight="bold">Vitamin D3</text>
  <text x="876" y="286" font-family="Arial, sans-serif" font-size="8.5" fill="#6B8CB4">60K IU · Cap</text>
  <text x="876" y="300" font-family="Arial, sans-serif" font-size="9" fill="#1A6FD4" font-weight="bold">₹180</text>

  <!-- Order tracking card -->
  <rect x="782" y="316" width="164" height="72" rx="12" fill="rgba(26,111,212,0.06)" stroke="#1A6FD4" stroke-width="1" stroke-opacity="0.25"/>
  <text x="794" y="333" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0F2B5A">Order #QM-2841</text>
  <text x="794" y="348" font-family="Arial, sans-serif" font-size="8.5" fill="#6B8CB4">3 items · Placed today at 9:42 AM</text>

  <!-- Progress dots -->
  <circle cx="794" cy="366" r="5" fill="#1A6FD4"/>
  <line x1="799" y1="366" x2="820" y2="366" stroke="#1A6FD4" stroke-width="1.5"/>
  <circle cx="825" cy="366" r="5" fill="#1A6FD4"/>
  <line x1="830" y1="366" x2="851" y2="366" stroke="#1A6FD4" stroke-width="1.5"/>
  <circle cx="856" cy="366" r="5" fill="#D8E8F8"/>
  <line x1="861" y1="366" x2="882" y2="366" stroke="#D8E8F8" stroke-width="1.5"/>
  <circle cx="887" cy="366" r="5" fill="#D8E8F8"/>
  <text x="787" y="381" font-family="Arial, sans-serif" font-size="7.5" fill="#1A6FD4">Placed</text>
  <text x="817" y="381" font-family="Arial, sans-serif" font-size="7.5" fill="#1A6FD4">Packed</text>
  <text x="847" y="381" font-family="Arial, sans-serif" font-size="7.5" fill="#A0BCDC">Out</text>
  <text x="878" y="381" font-family="Arial, sans-serif" font-size="7.5" fill="#A0BCDC">Delivered</text>

  <!-- Bottom nav -->
  <line x1="772" y1="408" x2="958" y2="408" stroke="#D8E8F8" stroke-width="1"/>
  <rect x="772" y="408" width="186" height="45" rx="0" fill="white"/>
  <circle cx="818" cy="430" r="14" fill="rgba(26,111,212,0.1)"/>
  <text x="818" y="435" font-family="Arial, sans-serif" font-size="14" fill="#1A6FD4" text-anchor="middle">⌂</text>
  <text x="865" y="435" font-family="Arial, sans-serif" font-size="14" fill="#A0BCDC" text-anchor="middle">◫</text>
  <text x="912" y="435" font-family="Arial, sans-serif" font-size="14" fill="#A0BCDC" text-anchor="middle">♡</text>

  <!-- Second phone shadow -->
  <rect x="1000" y="110" width="170" height="310" rx="22" fill="white" stroke="#D8E8F8" stroke-width="1.5" fill-opacity="0.45" stroke-opacity="0.45"/>
</svg>
