<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0B06"/>
      <stop offset="100%" stop-color="#2E1509"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#C84B11" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1A0B06" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#8B2500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1A0B06" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#glow)"/>
  <rect width="1200" height="500" fill="url(#glow2)"/>

  <!-- Subtle texture lines -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#C84B11" stroke-width="0.4" stroke-opacity="0.12"/>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#C84B11" stroke-width="0.4" stroke-opacity="0.08"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#C84B11" stroke-width="0.4" stroke-opacity="0.08"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#C84B11" stroke-width="0.4" stroke-opacity="0.08"/>

  <!-- Navbar -->
  <rect width="1200" height="66" fill="#0D0602" fill-opacity="0.85"/>
  <line x1="0" y1="66" x2="1200" y2="66" stroke="#C84B11" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Logo -->
  <circle cx="52" cy="33" r="13" fill="#C84B11"/>
  <text x="76" y="39" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#F5E6D3" letter-spacing="2.5">SPICE &amp; SMOKE</text>

  <!-- Nav links -->
  <text x="510" y="38" font-family="Arial, sans-serif" font-size="11" fill="#A08060" letter-spacing="2">MENU</text>
  <text x="610" y="38" font-family="Arial, sans-serif" font-size="11" fill="#A08060" letter-spacing="2">STORY</text>
  <text x="710" y="38" font-family="Arial, sans-serif" font-size="11" fill="#A08060" letter-spacing="2">EVENTS</text>
  <text x="810" y="38" font-family="Arial, sans-serif" font-size="11" fill="#A08060" letter-spacing="2">GALLERY</text>

  <!-- Book table button -->
  <rect x="1040" y="16" width="128" height="34" rx="2" fill="#C84B11"/>
  <text x="1104" y="38" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1.5">BOOK A TABLE</text>

  <!-- Badge -->
  <rect x="80" y="102" width="218" height="26" rx="13" fill="#C84B11" fill-opacity="0.12" stroke="#C84B11" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="98" cy="115" r="4" fill="#C84B11"/>
  <text x="111" y="120" font-family="Arial, sans-serif" font-size="10.5" fill="#C84B11" letter-spacing="2">BENGALURU · EST. 2019</text>

  <!-- Main headline -->
  <text x="80" y="195" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#F5E6D3" letter-spacing="-0.5">Where Spice</text>
  <text x="80" y="260" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#F5E6D3" letter-spacing="-0.5">Meets </text>
  <text x="270" y="260" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#C84B11" font-style="italic">Passion.</text>

  <!-- Subtext -->
  <text x="80" y="305" font-family="Arial, sans-serif" font-size="15" fill="#A08060">Authentic Indian cuisine crafted from heritage recipes.</text>
  <text x="80" y="330" font-family="Arial, sans-serif" font-size="15" fill="#6B4A2A">Dine in &nbsp;·&nbsp; Takeaway &nbsp;·&nbsp; Private events</text>

  <!-- CTA Buttons -->
  <rect x="80" y="365" width="164" height="48" rx="3" fill="#C84B11"/>
  <text x="162" y="396" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1.5">BOOK A TABLE</text>
  <rect x="262" y="365" width="148" height="48" rx="3" fill="none" stroke="#6B4A2A" stroke-width="1.5"/>
  <text x="336" y="396" font-family="Arial, sans-serif" font-size="12" fill="#A08060" text-anchor="middle" letter-spacing="1.5">VIEW MENU</text>

  <!-- Right side decorative plate rings -->
  <circle cx="920" cy="280" r="190" fill="none" stroke="#C84B11" stroke-width="0.8" stroke-opacity="0.12"/>
  <circle cx="920" cy="280" r="150" fill="rgba(200,75,17,0.05)" stroke="#C84B11" stroke-width="1" stroke-opacity="0.18"/>
  <circle cx="920" cy="280" r="108" fill="rgba(200,75,17,0.08)" stroke="#C84B11" stroke-width="1.5" stroke-opacity="0.28"/>
  <circle cx="920" cy="280" r="64" fill="rgba(200,75,17,0.14)" stroke="#C84B11" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Food shape clusters -->
  <ellipse cx="860" cy="230" rx="38" ry="32" fill="rgba(180,60,10,0.35)" stroke="#C84B11" stroke-width="1.5" stroke-opacity="0.5"/>
  <ellipse cx="980" cy="245" rx="30" ry="26" fill="rgba(160,50,8,0.3)" stroke="#C84B11" stroke-width="1" stroke-opacity="0.45"/>
  <ellipse cx="940" cy="340" rx="34" ry="28" fill="rgba(170,55,9,0.32)" stroke="#C84B11" stroke-width="1.5" stroke-opacity="0.48"/>
  <ellipse cx="870" cy="325" rx="26" ry="22" fill="rgba(150,45,7,0.28)" stroke="#C84B11" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Center spice dot -->
  <circle cx="920" cy="280" r="18" fill="#C84B11" fill-opacity="0.7"/>
  <circle cx="920" cy="280" r="8" fill="#C84B11"/>

  <!-- Rating stars at bottom left -->
  <text x="80" y="462" font-family="Arial, sans-serif" font-size="14" fill="#C84B11">★★★★★</text>
  <text x="170" y="462" font-family="Arial, sans-serif" font-size="12" fill="#6B4A2A">4.9 · 240+ reviews · Koramangala, Bengaluru</text>
</svg>
