<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FBF8"/>
      <stop offset="100%" stop-color="#E6F7F2"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9E78"/>
      <stop offset="100%" stop-color="#0A7D5E"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9E78"/>
      <stop offset="100%" stop-color="#15C896"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0D9E78" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#F0FBF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#bgGlow)"/>

  <!-- Nav -->
  <rect width="1200" height="64" fill="rgba(255,255,255,0.92)"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#D0EDE6" stroke-width="1"/>

  <!-- Logo -->
  <rect x="36" y="18" width="28" height="28" rx="8" fill="url(#cardGrad)"/>
  <text x="50" y="37" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">F</text>
  <text x="76" y="37" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0D2B22" letter-spacing="0.5">Flow Studio</text>

  <!-- Nav links -->
  <text x="490" y="37" font-family="Arial, sans-serif" font-size="12" fill="#6B8C84" letter-spacing="1">Classes</text>
  <text x="580" y="37" font-family="Arial, sans-serif" font-size="12" fill="#6B8C84" letter-spacing="1">Trainers</text>
  <text x="675" y="37" font-family="Arial, sans-serif" font-size="12" fill="#6B8C84" letter-spacing="1">Pricing</text>
  <text x="762" y="37" font-family="Arial, sans-serif" font-size="12" fill="#6B8C84" letter-spacing="1">Community</text>

  <!-- CTA -->
  <rect x="1040" y="16" width="120" height="32" rx="16" fill="url(#cardGrad)"/>
  <text x="1100" y="37" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Get Started</text>

  <!-- Left hero content -->
  <!-- Badge -->
  <rect x="80" y="98" width="210" height="26" rx="13" fill="rgba(13,158,120,0.1)" stroke="#0D9E78" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="97" cy="111" r="4" fill="#0D9E78"/>
  <text x="110" y="116" font-family="Arial, sans-serif" font-size="10.5" fill="#0D9E78" letter-spacing="1.5">WELLNESS · BENGALURU</text>

  <!-- Headline -->
  <text x="80" y="185" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#0D2B22">Move Better,</text>
  <text x="80" y="248" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#0D9E78">Feel Amazing.</text>

  <!-- Subtext -->
  <text x="80" y="295" font-family="Arial, sans-serif" font-size="15" fill="#4A7A6E">Book yoga, HIIT &amp; strength classes at your pace.</text>
  <text x="80" y="318" font-family="Arial, sans-serif" font-size="15" fill="#7AAFA4">Track progress. Connect with trainers. Stay consistent.</text>

  <!-- Buttons -->
  <rect x="80" y="355" width="180" height="48" rx="24" fill="url(#cardGrad)"/>
  <text x="170" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Book a Class</text>
  <rect x="278" y="355" width="148" height="48" rx="24" fill="none" stroke="#0D9E78" stroke-width="1.5"/>
  <text x="352" y="385" font-family="Arial, sans-serif" font-size="13" fill="#0D9E78" text-anchor="middle">View Schedule</text>

  <!-- Stats row -->
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0D2B22">2,400+</text>
  <text x="80" y="472" font-family="Arial, sans-serif" font-size="11" fill="#6B8C84" letter-spacing="1">MEMBERS</text>
  <text x="210" y="450" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0D2B22">48</text>
  <text x="210" y="472" font-family="Arial, sans-serif" font-size="11" fill="#6B8C84" letter-spacing="1">CLASSES/WEEK</text>
  <text x="340" y="450" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0D2B22">4.9★</text>
  <text x="340" y="472" font-family="Arial, sans-serif" font-size="11" fill="#6B8C84" letter-spacing="1">RATING</text>

  <!-- Right side — Phone mockup -->
  <rect x="750" y="80" width="200" height="380" rx="28" fill="white" stroke="#D0EDE6" stroke-width="2"/>
  <rect x="762" y="92" width="176" height="356" rx="20" fill="#F8FFFE"/>

  <!-- Phone notch -->
  <rect x="820" y="88" width="60" height="14" rx="7" fill="white"/>

  <!-- App header -->
  <rect x="762" y="92" width="176" height="52" rx="20" fill="url(#cardGrad)"/>
  <rect x="762" y="120" width="176" height="24" fill="url(#cardGrad)"/>
  <text x="850" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Today's Plan</text>
  <text x="850" y="138" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">Wednesday, 14 May</text>

  <!-- Progress ring area -->
  <circle cx="850" cy="205" r="48" fill="none" stroke="#D0EDE6" stroke-width="7"/>
  <circle cx="850" cy="205" r="48" fill="none" stroke="url(#ringGrad)" stroke-width="7" stroke-dasharray="226 75" stroke-dashoffset="56" stroke-linecap="round"/>
  <text x="850" y="200" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0D2B22" text-anchor="middle">75%</text>
  <text x="850" y="218" font-family="Arial, sans-serif" font-size="9" fill="#6B8C84" text-anchor="middle">COMPLETED</text>

  <!-- Class cards -->
  <rect x="776" y="264" width="148" height="52" rx="10" fill="rgba(13,158,120,0.08)" stroke="#0D9E78" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="786" y="274" width="8" height="32" rx="4" fill="#0D9E78"/>
  <text x="804" y="287" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0D2B22">Morning Yoga</text>
  <text x="804" y="303" font-family="Arial, sans-serif" font-size="9.5" fill="#6B8C84">7:00 AM · Studio A · 60 min</text>
  <text x="900" y="296" font-family="Arial, sans-serif" font-size="9" fill="#0D9E78" font-weight="bold">DONE ✓</text>

  <rect x="776" y="324" width="148" height="52" rx="10" fill="white" stroke="#D0EDE6" stroke-width="1"/>
  <rect x="786" y="334" width="8" height="32" rx="4" fill="#15C896" fill-opacity="0.5"/>
  <text x="804" y="347" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0D2B22">HIIT Circuit</text>
  <text x="804" y="363" font-family="Arial, sans-serif" font-size="9.5" fill="#6B8C84">6:30 PM · Studio B · 45 min</text>
  <text x="900" y="356" font-family="Arial, sans-serif" font-size="9" fill="#A0BDB8">UPCOMING</text>

  <!-- Bottom nav -->
  <rect x="762" y="408" width="176" height="40" rx="0" fill="white" stroke="#EEF7F4" stroke-width="0"/>
  <rect x="762" y="408" width="176" height="40" rx="0" fill="white"/>
  <line x1="762" y1="408" x2="938" y2="408" stroke="#EEF7F4" stroke-width="1"/>
  <circle cx="806" cy="428" r="12" fill="rgba(13,158,120,0.12)"/>
  <text x="806" y="433" font-family="Arial, sans-serif" font-size="14" fill="#0D9E78" text-anchor="middle">⌂</text>
  <text x="850" y="433" font-family="Arial, sans-serif" font-size="14" fill="#A0BDB8" text-anchor="middle">◷</text>
  <text x="894" y="433" font-family="Arial, sans-serif" font-size="14" fill="#A0BDB8" text-anchor="middle">♡</text>

  <!-- Second phone (faded, rotated feel) -->
  <rect x="980" y="120" width="160" height="300" rx="22" fill="white" stroke="#D0EDE6" stroke-width="1.5" fill-opacity="0.5" stroke-opacity="0.5"/>
</svg>
