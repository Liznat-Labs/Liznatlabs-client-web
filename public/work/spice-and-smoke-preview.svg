<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D1200;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="imgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3D1A00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5C2800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#heroBg)"/>

  <!-- Nav bar -->
  <rect width="800" height="56" fill="#110500"/>
  <text x="32" y="34" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#E8801A" letter-spacing="3">SPICE &amp; SMOKE</text>
  <text x="420" y="33" font-family="Arial, sans-serif" font-size="11" fill="#C4A882" letter-spacing="2">MENU</text>
  <text x="490" y="33" font-family="Arial, sans-serif" font-size="11" fill="#C4A882" letter-spacing="2">RESERVATIONS</text>
  <text x="610" y="33" font-family="Arial, sans-serif" font-size="11" fill="#C4A882" letter-spacing="2">ABOUT</text>
  <text x="680" y="33" font-family="Arial, sans-serif" font-size="11" fill="#C4A882" letter-spacing="2">CONTACT</text>

  <!-- Nav divider -->
  <rect y="56" width="800" height="1" fill="#3D1A00"/>

  <!-- Left content area -->
  <text x="48" y="118" font-family="Georgia, serif" font-size="11" fill="#E8801A" letter-spacing="4">BENGALURU · EST. 2019</text>

  <!-- Main headline -->
  <text x="48" y="168" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#F5E6D0">Authentic</text>
  <text x="48" y="218" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#F5E6D0">Flavours,</text>
  <text x="48" y="268" font-family="Georgia, serif" font-size="42" font-style="italic" fill="#E8801A">Unforgettable</text>
  <text x="48" y="318" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#F5E6D0">Experience.</text>

  <!-- Subtext -->
  <text x="48" y="354" font-family="Arial, sans-serif" font-size="13" fill="#A08060">Wood-fired tandoor, slow-smoked meats &amp; classic</text>
  <text x="48" y="372" font-family="Arial, sans-serif" font-size="13" fill="#A08060">Indian flavours crafted with love.</text>

  <!-- CTA Button -->
  <rect x="48" y="398" width="170" height="44" rx="4" fill="#E8801A"/>
  <text x="133" y="425" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1A0800" text-anchor="middle" letter-spacing="1">RESERVE A TABLE</text>

  <!-- Secondary link -->
  <text x="234" y="422" font-family="Arial, sans-serif" font-size="12" fill="#C4A882">View Menu →</text>

  <!-- Right image panel -->
  <rect x="430" y="70" width="340" height="390" rx="8" fill="url(#imgGrad)"/>

  <!-- Decorative food plate mockup -->
  <!-- Plate -->
  <ellipse cx="600" cy="290" rx="120" ry="110" fill="#2A1000"/>
  <ellipse cx="600" cy="290" rx="108" ry="98" fill="#3D1A00"/>

  <!-- Food items on plate -->
  <ellipse cx="600" cy="285" rx="75" ry="65" fill="#6B2E0A"/>
  <!-- Curry/sauce pool -->
  <ellipse cx="598" cy="288" rx="60" ry="52" fill="#8B3A0C"/>
  <!-- Meat pieces -->
  <ellipse cx="580" cy="270" rx="22" ry="16" fill="#5C1A00" transform="rotate(-15 580 270)"/>
  <ellipse cx="614" cy="262" rx="20" ry="14" fill="#6B2200" transform="rotate(10 614 262)"/>
  <ellipse cx="600" cy="305" rx="24" ry="15" fill="#5C1A00" transform="rotate(5 600 305)"/>
  <!-- Garnish -->
  <ellipse cx="572" cy="260" rx="6" ry="8" fill="#2D7A2D"/>
  <ellipse cx="628" cy="258" rx="5" ry="7" fill="#2D7A2D"/>
  <ellipse cx="585" cy="315" rx="5" ry="6" fill="#2D7A2D"/>
  <!-- Spices/seeds -->
  <circle cx="595" cy="275" r="2" fill="#FFD700"/>
  <circle cx="610" cy="282" r="2" fill="#FFD700"/>
  <circle cx="588" cy="295" r="2" fill="#FFD700"/>

  <!-- Bread/naan beside plate -->
  <ellipse cx="490" cy="360" rx="45" ry="25" fill="#C4873A" transform="rotate(-20 490 360)"/>
  <ellipse cx="490" cy="358" rx="38" ry="20" fill="#D4973A" transform="rotate(-20 490 358)"/>
  <!-- Char marks on naan -->
  <ellipse cx="482" cy="352" rx="10" ry="4" fill="#8B5A1A" opacity="0.6" transform="rotate(-20 482 352)"/>
  <ellipse cx="497" cy="362" rx="8" ry="3" fill="#8B5A1A" opacity="0.6" transform="rotate(-20 497 362)"/>

  <!-- Spice bowl -->
  <ellipse cx="695" cy="180" rx="35" ry="30" fill="#2A1000"/>
  <ellipse cx="695" cy="178" rx="28" ry="24" fill="#8B2500"/>
  <text x="695" y="183" font-family="Arial" font-size="8" fill="#FFD700" text-anchor="middle">CHILLI</text>

  <!-- Steam lines -->
  <path d="M588 205 Q592 195 588 185 Q584 175 588 165" stroke="#C4A882" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M600 200 Q604 190 600 180 Q596 170 600 160" stroke="#C4A882" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M612 208 Q616 198 612 188 Q608 178 612 168" stroke="#C4A882" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Restaurant rating strip -->
  <rect x="448" y="430" width="304" height="30" rx="4" fill="#1A0800" opacity="0.8"/>
  <text x="462" y="450" font-family="Arial" font-size="11" fill="#E8801A">★★★★★</text>
  <text x="520" y="450" font-family="Arial" font-size="11" fill="#C4A882">4.8 · 2,400+ reviews · Zomato</text>

  <!-- Table booking badge -->
  <rect x="448" y="78" width="160" height="30" rx="15" fill="#E8801A" opacity="0.15"/>
  <rect x="448" y="78" width="160" height="30" rx="15" fill="none" stroke="#E8801A" stroke-width="1"/>
  <circle cx="466" cy="93" r="5" fill="#4CAF50"/>
  <text x="476" y="97" font-family="Arial" font-size="10" fill="#E8801A">Accepting Bookings</text>

  <!-- Bottom info bar -->
  <rect y="468" width="800" height="32" fill="#0D0400"/>
  <text x="48" y="489" font-family="Arial, sans-serif" font-size="10" fill="#6B4020">📍 Indiranagar, Bengaluru</text>
  <text x="240" y="489" font-family="Arial, sans-serif" font-size="10" fill="#6B4020">⏰ 12PM – 11PM Daily</text>
  <text x="430" y="489" font-family="Arial, sans-serif" font-size="10" fill="#6B4020">📞 +91 80 4567 8901</text>
  <text x="620" y="489" font-family="Arial, sans-serif" font-size="10" fill="#6B4020">🔥 Wood-fired since 2019</text>
</svg>
