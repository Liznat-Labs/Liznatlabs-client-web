name: Deploy to AWS EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t liznat-labs:latest .

      - name: Save image as tarball
        run: docker save liznat-labs:latest | gzip > liznat-labs.tar.gz

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_KEY }}
          source:   liznat-labs.tar.gz
          target:   /opt/liznat-labs/

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_KEY }}
          script: |
            cd /opt/liznat-labs
            git pull origin main
            docker load < liznat-labs.tar.gz
            rm liznat-labs.tar.gz
            docker-compose -f infra/docker-compose.prod.yml down || true
            docker-compose -f infra/docker-compose.prod.yml up -d
            docker image prune -f
            echo "Deploy complete."
